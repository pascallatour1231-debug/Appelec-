<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APPELEC - Calcul Électrique</title>

  <!-- PWA Configuration -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4da3ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="APPELEC">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --surface: #151515;
      --border: #2a2a2a;
      --text: #e8e8e8;
      --text-dim: #888;
      --accent: #4da3ff;
      --accent-dim: rgba(77, 163, 255, 0.55);
      --success: #4adebe;
      --radius: 12px;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 480px;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      padding-top: 20px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--accent) 0%, rgba(77, 163, 255, 0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      color: var(--text-dim);
      letter-spacing: 0.05em;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .card:hover { border-color: var(--accent-dim); }

    .input-group { margin-bottom: 24px; }
    .input-group:last-child { margin-bottom: 0; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    input, select {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 18px;
      font-family: 'DM Mono', monospace;
      transition: all 0.2s ease;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(77, 163, 255, 0.18);
    }

    input::placeholder {
      color: var(--text-dim);
      opacity: 0.5;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .unit-selector {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .unit-btn {
      flex: 1;
      padding: 8px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      font-size: 12px;
      font-family: 'DM Mono', monospace;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .unit-btn:hover {
      border-color: var(--accent-dim);
      color: var(--text);
    }

    .unit-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
      font-weight: 500;
    }

    .results {
      background: linear-gradient(135deg, rgba(77, 163, 255, 0.06) 0%, rgba(77, 163, 255, 0.02) 100%);
      border: 1px solid var(--accent-dim);
      border-radius: var(--radius);
      padding: 24px;
      margin-top: 24px;
      animation: slideIn 0.4s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-item {
      padding: 16px 0;
      border-bottom: 1px solid rgba(77, 163, 255, 0.10);
    }

    .result-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .result-item:first-child { padding-top: 0; }

    .result-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }

    .result-value {
      font-size: 28px;
      font-weight: 700;
      font-family: 'DM Mono', monospace;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .result-unit {
      font-size: 18px;
      color: var(--text-dim);
      font-weight: 400;
      margin-left: 6px;
    }

    .result-detail {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 4px;
      font-family: 'Outfit', sans-serif;
    }

    .warning {
      background: rgba(77, 163, 255, 0.10);
      border-left: 3px solid var(--accent);
      padding: 12px 16px;
      border-radius: 6px;
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-dim);
    }

    footer {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      opacity: 0.5;
    }

    .install-prompt {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, var(--accent) 0%, rgba(77, 163, 255, 0.8) 100%);
      color: var(--bg);
      padding: 12px 24px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 4px 20px rgba(77, 163, 255, 0.35);
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 1000;
      display: none;
    }

    .install-prompt:hover {
      transform: translateX(-50%) translateY(-2px);
      box-shadow: 0 6px 25px rgba(77, 163, 255, 0.50);
    }

    .install-prompt.show {
      display: block;
      animation: slideUp 0.4s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateX(-50%) translateY(100px); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }

    @media (max-width: 480px) {
      .row { grid-template-columns: 1fr; }
      h1 { font-size: 26px; }
      .result-value { font-size: 24px; }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>⚡ Appelec</h1>
      <div class="subtitle">P → I → Section → DJ</div>
    </header>

    <div class="card">
      <div class="input-group">
        <label>Je connais</label>
        <div class="unit-selector">
          <button class="unit-btn active" data-mode="power">La Puissance (P)</button>
          <button class="unit-btn" data-mode="current">Le Courant (I)</button>
        </div>
      </div>

      <div class="input-group">
        <label>Puissance</label>
        <input type="number" id="power" placeholder="3000" inputmode="decimal">
        <div class="unit-selector">
          <button class="unit-btn active" data-unit="w">Watts (W)</button>
          <button class="unit-btn" data-unit="kw">Kilowatts (kW)</button>
        </div>
      </div>

      <div class="input-group">
        <label>Courant (A)</label>
        <input type="number" id="currentInput" placeholder="16" inputmode="decimal">
      </div>

      <div class="row">
        <div class="input-group">
          <label>Type</label>
          <select id="phase">
            <option value="mono">Monophasé</option>
            <option value="tri">Triphasé</option>
          </select>
        </div>
        <div class="input-group">
          <label>Tension (V)</label>
          <select id="voltage">
            <option value="230">230 V</option>
            <option value="400">400 V</option>
          </select>
        </div>
      </div>

      <!-- ✅ NOUVEAU : distance -->
      <div class="input-group" style="margin-top: 24px;">
        <label>Distance (m)</label>
        <input type="number" id="distance" placeholder="80" inputmode="decimal">
      </div>
    </div>

    <div class="results" id="results" style="display: none;">
      <div class="result-item">
        <div class="result-label">Courant</div>
        <div class="result-value" id="current">—<span class="result-unit">A</span></div>
        <div class="result-detail" id="currentDetail"></div>
      </div>

      <div class="result-item">
        <div class="result-label">Section câble</div>
        <div class="result-value" id="section">—<span class="result-unit">mm²</span></div>
        <div class="result-detail" id="sectionDetail"></div>
      </div>

      <!-- ✅ NOUVEAU : section mini chute 5% -->
      <div class="result-item">
        <div class="result-label">Section min (ΔU 5%)</div>
        <div class="result-value" id="vdSection">—<span class="result-unit">mm²</span></div>
        <div class="result-detail" id="vdSectionDetail"></div>
      </div>

      <div class="result-item">
        <div class="result-label">Disjoncteur</div>
        <div class="result-value" id="breaker">—<span class="result-unit">A</span></div>
        <div class="result-detail" id="breakerDetail"></div>
      </div>

      <!-- ✅ NOUVEAU : longueur max chute 5% -->
      <div class="result-item">
        <div class="result-label">Longueur max (ΔU 5%)</div>
        <div class="result-value" id="maxLength">—<span class="result-unit">m</span></div>
        <div class="result-detail" id="maxLengthDetail"></div>
      </div>

      <div class="warning">
        ⚠️ Valeurs indicatives. Vérifiez les conditions de pose et normes en vigueur.
      </div>
    </div>

    <footer>
      Version simplifiée • Cuivre • cosφ = 0.8 • ΔU = 5%
    </footer>
  </div>

  <!-- Bouton d'installation PWA -->
  <button id="installBtn" class="install-prompt">
    📲 Installer l'application
  </button>

  <script>
    // =========================================================
    // Modèle "général puissance" (électriciens, en connaissance)
    // - cosφ fixe = 0.8
    // - 1,5 mm² : 16A max
    // - 4 mm² : supprimé (donc 25A saute sur 6 mm²)
    // - Section déterminée par calibre DJ (simplifié FR)
    // - Chute de tension : 5% (Cuivre, rho 0.0175)
    // =========================================================

    const VD_PERCENT = 0.05; // chute 5%
    const RHO_CU = 0.0175;   // Ω·mm²/m (20°C)

    const BREAKER_SIZES = [2, 4, 6, 10, 16, 20, 25, 32, 40, 50, 63, 80, 100, 125];

    // Calibre DJ -> section mini (Cuivre) - simplifié
    const SECTION_BY_BREAKER = [
      { breaker: 2,   section: 1.5 },
      { breaker: 4,   section: 1.5 },
      { breaker: 6,   section: 1.5 },
      { breaker: 10,  section: 1.5 },
      { breaker: 16,  section: 1.5 }, // 16A max sur 1,5
      { breaker: 20,  section: 2.5 },
      { breaker: 25,  section: 6 },   // 4 mm² supprimé => saut
      { breaker: 32,  section: 6 },
      { breaker: 40,  section: 10 },
      { breaker: 50,  section: 10 },
      { breaker: 63,  section: 16 },
      { breaker: 80,  section: 25 },
      { breaker: 100, section: 35 },
      { breaker: 125, section: 50 }
    ];

    // Sections normalisées (sans 4)
    const SECTIONS = [1.5, 2.5, 6, 10, 16, 25, 35, 50, 70, 95, 120, 150, 185, 240];
    function nextSectionUp(sMin) {
      return SECTIONS.find(s => s >= sMin) || null;
    }

    let currentUnit = 'w';
    let calcMode = 'power'; // 'power' ou 'current'

    document.querySelectorAll('.unit-btn[data-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        const parent = btn.parentElement;
        parent.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        calcMode = btn.dataset.mode;
        updateFieldStates();
        calculate();
      });
    });

    document.querySelectorAll('.unit-btn[data-unit]').forEach(btn => {
      btn.addEventListener('click', () => {
        const parent = btn.parentElement;
        parent.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentUnit = btn.dataset.unit;
        calculate();
      });
    });

    function updateFieldStates() {
      const powerField = document.getElementById('power');
      const currentField = document.getElementById('currentInput');

      if (calcMode === 'power') {
        powerField.disabled = false;
        currentField.disabled = true;
        currentField.style.opacity = '0.5';
        currentField.style.cursor = 'not-allowed';
        powerField.style.opacity = '1';
        powerField.style.cursor = 'text';
      } else {
        powerField.disabled = true;
        currentField.disabled = false;
        powerField.style.opacity = '0.5';
        powerField.style.cursor = 'not-allowed';
        currentField.style.opacity = '1';
        currentField.style.cursor = 'text';
      }
    }

    document.getElementById('phase').addEventListener('change', (e) => {
      const voltage = document.getElementById('voltage');
      if (e.target.value === 'tri') voltage.value = '400';
      else voltage.value = '230';
      calculate();
    });

    // ✅ distance ajouté
    ['power', 'currentInput', 'phase', 'voltage', 'distance'].forEach(id => {
      document.getElementById(id).addEventListener('input', calculate);
      document.getElementById(id).addEventListener('change', calculate);
    });

    function calculate() {
      const phase = document.getElementById('phase').value;
      const voltage = parseFloat(document.getElementById('voltage').value);
      const cos = 0.8;

      let current, powerW;

      if (calcMode === 'power') {
        const powerInput = parseFloat(document.getElementById('power').value);
        if (!powerInput || !voltage) {
          document.getElementById('results').style.display = 'none';
          return;
        }

        powerW = currentUnit === 'kw' ? powerInput * 1000 : powerInput;

        if (phase === 'mono') current = powerW / (voltage * cos);
        else current = powerW / (Math.sqrt(3) * voltage * cos);

        document.getElementById('currentInput').value = current.toFixed(1);
      } else {
        current = parseFloat(document.getElementById('currentInput').value);
        if (!current || !voltage) {
          document.getElementById('results').style.display = 'none';
          return;
        }

        if (phase === 'mono') powerW = voltage * current * cos;
        else powerW = Math.sqrt(3) * voltage * current * cos;

        const displayPower = currentUnit === 'kw' ? powerW / 1000 : powerW;
        document.getElementById('power').value = displayPower.toFixed(currentUnit === 'kw' ? 2 : 0);
      }

      const Ib = current; // courant d'emploi

      // ===== Disjoncteur : calibre normalisé >= Ib =====
      const breaker = BREAKER_SIZES.find(b => b >= Ib) || null;

      // ===== Section "DJ -> section mini" =====
      let sectionDJ = null;
      if (breaker) {
        const row = SECTION_BY_BREAKER.find(r => r.breaker === breaker);
        sectionDJ = row ? row.section : null;
      }

      // ===== Chute de tension : section min pour la distance saisie (ΔU 5%) =====
      const L = parseFloat(document.getElementById('distance').value); // m
      const dU = voltage * VD_PERCENT; // V

      let vdSectionMin = null;
      let vdSectionRounded = null;

      if (L && L > 0 && sectionDJ) {
        if (phase === 'mono') {
          vdSectionMin = (2 * RHO_CU * L * Ib) / dU;
        } else {
          vdSectionMin = (Math.sqrt(3) * RHO_CU * L * Ib) / dU;
        }
        vdSectionRounded = nextSectionUp(vdSectionMin);
      }

      // ===== Section finale retenue : max(DJ, chute) =====
      let finalSection = sectionDJ;
      if (vdSectionRounded) finalSection = Math.max(finalSection, vdSectionRounded);

      // ===== Longueur max (ΔU 5%) à partir de la section finale =====
      let Lmax = null;
      if (finalSection && finalSection > 0) {
        if (phase === 'mono') {
          Lmax = (dU * finalSection) / (2 * RHO_CU * Ib);
        } else {
          Lmax = (dU * finalSection) / (Math.sqrt(3) * RHO_CU * Ib);
        }
      }

      // Affichage courant
      document.getElementById('current').innerHTML =
        `${current.toFixed(1)}<span class="result-unit">A</span>`;
      document.getElementById('currentDetail').textContent =
        `${powerW.toLocaleString('fr-FR')} W • ${voltage} V • ${phase === 'mono' ? 'Mono' : 'Tri'} • cosφ 0.8`;

      // Affichage section câble (finale)
      if (finalSection) {
        document.getElementById('section').innerHTML =
          `${finalSection}<span class="result-unit">mm²</span>`;
        const extra = (vdSectionRounded && vdSectionRounded > sectionDJ)
          ? `Chute 5% impose ${vdSectionRounded} mm²`
          : `DJ impose ${sectionDJ} mm²`;
        document.getElementById('sectionDetail').textContent =
          `Cuivre • règle simplifiée FR • ${extra} • 4 mm² exclu`;
      } else {
        document.getElementById('section').innerHTML =
          `—<span class="result-unit">mm²</span>`;
        document.getElementById('sectionDetail').textContent =
          `Section non déterminée`;
      }

      // Affichage section min chute 5%
      if (vdSectionRounded) {
        document.getElementById('vdSection').innerHTML =
          `${vdSectionRounded}<span class="result-unit">mm²</span>`;
        document.getElementById('vdSectionDetail').textContent =
          `Distance ${L} m • Smin théorique ${vdSectionMin.toFixed(2)} mm²`;
      } else {
        document.getElementById('vdSection').innerHTML =
          `—<span class="result-unit">mm²</span>`;
        document.getElementById('vdSectionDetail').textContent =
          `Entrez une distance pour calculer la chute`;
      }

      // Affichage disjoncteur
      if (breaker) {
        document.getElementById('breaker').innerHTML =
          `${breaker}<span class="result-unit">A</span>`;
        document.getElementById('breakerDetail').textContent =
          `Calibre normalisé ≥ Ib (modèle simplifié)`;
      } else {
        document.getElementById('breaker').innerHTML =
          `>125<span class="result-unit">A</span>`;
        document.getElementById('breakerDetail').textContent =
          `Hors table — calcul à traiter au cas par cas`;
      }

      // Affichage longueur max 5%
      if (Lmax) {
        document.getElementById('maxLength').innerHTML =
          `${Math.floor(Lmax)}<span class="result-unit">m</span>`;
        document.getElementById('maxLengthDetail').textContent =
          `Avec section ${finalSection} mm² • ΔU 5%`;
      } else {
        document.getElementById('maxLength').innerHTML =
          `—<span class="result-unit">m</span>`;
        document.getElementById('maxLengthDetail').textContent =
          `Section non déterminée`;
      }

      document.getElementById('results').style.display = 'block';
    }

    updateFieldStates();
    calculate();

    // ========== PWA Installation ==========
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Service Worker enregistré'))
          .catch(err => console.log('Erreur Service Worker:', err));
      });
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.add('show');
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.classList.remove('show');
    });

    window.addEventListener('appinstalled', () => {
      installBtn.classList.remove('show');
    });
  </script>
</body>
</html>
